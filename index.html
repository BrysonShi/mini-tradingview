<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini TradingView · LongPort 通用画图看板</title>

  <!-- KLineCharts 9 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/klinecharts@9/dist/umd/klinecharts.min.css" />
  <!-- trading-chest 0.5.3 (内置 KLineChartPro) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/trading-chest@0.5.3/dist/trading-chest.css" />

  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a22;
      --panel-2: #1c212c;
      --border: #262c38;
      --text: #e6e9ef;
      --text-dim: #8a93a6;
      --accent: #4f8cff;
      --accent-hover: #6ba0ff;
      --danger: #ef5b5b;
      --ok: #2ecc71;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      height: 100%;
      overflow: hidden;
    }

    /* === 顶栏 === */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      height: 52px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
    .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .brand .meta { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 6px; }

    .symbol-picker { display: flex; align-items: center; gap: 8px; }
    .symbol-picker input {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      width: 200px;
      font-size: 13px;
      outline: none;
    }
    .symbol-picker input:focus { border-color: var(--accent); }
    .btn {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }

    .toolbar-right { display: flex; align-items: center; gap: 8px; }
    .periods { display: flex; gap: 4px; }
    .periods button {
      background: var(--panel-2);
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .periods button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* === 主体 === */
    .main { display: flex; height: calc(100vh - 52px); }
    #chart-host { flex: 1; min-width: 0; }

    /* === 搜索 modal === */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: flex-start; justify-content: center;
      z-index: 1000;
      padding-top: 80px;
    }
    .modal-mask.open { display: flex; }
    .modal {
      width: 560px;
      max-height: 70vh;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex; flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h3 { margin: 0; font-size: 14px; font-weight: 600; }
    .modal-tabs { display: flex; gap: 0; padding: 0 16px; border-bottom: 1px solid var(--border); }
    .modal-tabs button {
      background: transparent;
      color: var(--text-dim);
      border: 0;
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .modal-tabs button.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .modal-body input[type=text] {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
    }
    .modal-body input[type=text]:focus { border-color: var(--accent); }
    .modal-body .hint { color: var(--text-dim); font-size: 12px; margin: 6px 0 12px; line-height: 1.6; }

    .result-list { margin-top: 8px; }
    .result-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .result-item:hover { background: var(--panel-2); }
    .result-item .left { display: flex; align-items: center; gap: 10px; }
    .result-item .badge {
      background: var(--panel-2);
      color: var(--text-dim);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .result-item .badge.us { color: #6bb4ff; }
    .result-item .badge.hk { color: #ffb84f; }
    .result-item .badge.cn { color: #ff6b9b; }
    .result-item .right { color: var(--text-dim); font-size: 12px; }
    .result-empty { color: var(--text-dim); font-size: 12px; padding: 20px; text-align: center; }

    /* === 状态提示 === */
    .status {
      position: fixed; bottom: 16px; right: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--text-dim);
      max-width: 320px;
      z-index: 999;
    }
    .status.ok { border-color: var(--ok); }
    .status.err { border-color: var(--danger); color: var(--danger); }
    .status.hidden { display: none; }

    /* mobile */
    @media (max-width: 768px) {
      .topbar { flex-wrap: wrap; height: auto; padding: 8px 10px; gap: 8px; }
      .brand { font-size: 13px; }
      .brand .meta { display: none; }
      .symbol-picker input { width: 130px; font-size: 12px; }
      .periods button { padding: 3px 6px; font-size: 11px; }
      .modal { width: 92vw; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      Mini TradingView
      <span class="meta">LongPort 通用画图看板</span>
    </div>
    <div class="symbol-picker">
      <input id="symbol-input" placeholder="输入 ticker，按 / 打开搜索" autocomplete="off" />
      <button class="btn" id="open-search">搜索</button>
    </div>
    <div class="toolbar-right">
      <div class="periods" id="periods">
        <button data-period="1d" class="active">日</button>
        <button data-period="1h">时</button>
        <button data-period="15m">15分</button>
        <button data-period="5m">5分</button>
      </div>
      <button class="btn ghost" id="reset-drawing">清空画图</button>
    </div>
  </div>

  <div class="main">
    <div id="chart-host"></div>
  </div>

  <!-- 搜索 modal -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal">
      <div class="modal-header">
        <h3>添加 / 切换标的</h3>
        <button class="btn ghost" id="modal-close">关闭</button>
      </div>
      <div class="modal-tabs">
        <button class="active" data-tab="search">搜索夜盘</button>
        <button data-tab="manual">手动输入</button>
      </div>
      <div class="modal-body">
        <!-- Tab 1: 搜索夜盘 -->
        <div class="tab-pane active" id="tab-search">
          <input type="text" id="search-input" placeholder="输入 ticker 或名称关键字，如 AAPL / 腾讯" autocomplete="off" />
          <div class="hint">数据源：长桥夜盘清单（US/HK/CN），每日 06:00 北京时间自动更新</div>
          <div class="result-list" id="search-results"></div>
        </div>
        <!-- Tab 2: 手动输入 -->
        <div class="tab-pane" id="tab-manual">
          <input type="text" id="manual-input" placeholder="如 AAPL / 00700.HK / 600519.SH" autocomplete="off" />
          <div class="hint">
            夜盘外的任意 ticker（A股普通股票/港股非夜盘/美股 ETF 等）。<br>
            格式：美股直接写 ticker；港股 5 位数字 + .HK；A 股 6 位数字 + .SH/.SZ。<br>
            添加后请同步在 <code>data/symbols.json</code> 中登记，K 线数据才会在工作日 21:00 北京时间自动更新。
          </div>
          <button class="btn" id="manual-add" style="margin-top: 8px;">添加到看板</button>
        </div>
      </div>
    </div>
  </div>

  <div class="status hidden" id="status"></div>

  <!-- 第三方库 -->
  <script src="https://cdn.jsdelivr.net/npm/klinecharts@9/dist/umd/klinecharts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/trading-chest@0.5.3/dist/trading-chest.umd.min.js"></script>

  <script>
  // ===== 全局状态 =====
  const state = {
    currentSymbol: null,        // 当前选中的长桥 ticker，如 AAPL.US
    currentUserTicker: null,    // 当前选中的用户输入 ticker，如 AAPL
    currentPeriod: '1d',
    klines: null,               // data/klines.json 内容
    securities: [],             // data/securities.json 内容
    chart: null,
  };

  // ===== 工具 =====
  function $(sel) { return document.querySelector(sel); }
  function $all(sel) { return Array.from(document.querySelectorAll(sel)); }

  function showStatus(msg, kind = 'ok', ms = 2500) {
    const el = $('#status');
    el.className = 'status ' + kind;
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(() => el.classList.add('hidden'), ms);
  }

  // 把长桥 ticker 转成前端展示符号（去 .US/.HK/.CN 后缀）
  function shortSymbol(lpSymbol) {
    return lpSymbol.replace(/\.(US|HK|CN)$/, '');
  }
  // 把长桥 ticker 转为 trading-chest/KLineChartPro 期望的 ticker 段
  function toFeederTicker(lpSymbol) {
    return shortSymbol(lpSymbol);
  }
  // 推断市场
  function inferMarket(lpSymbol) {
    if (lpSymbol.endsWith('.US')) return 'US';
    if (lpSymbol.endsWith('.HK')) return 'HK';
    if (lpSymbol.endsWith('.CN')) return 'CN';
    return 'US';
  }
  // 推断交易所（粗略）
  function inferExchange(lpSymbol) {
    const m = inferMarket(lpSymbol);
    if (m === 'US') return 'NASDAQ/NYSE';
    if (m === 'HK') return 'HKEX';
    if (m === 'CN') return 'SSE/SZSE';
    return '';
  }

  // ===== 数据加载 =====
  async function loadKlines() {
    if (state.klines) return state.klines;
    try {
      const r = await fetch('./data/klines.json', { cache: 'no-store' });
      if (!r.ok) {
        state.klines = {};
        return state.klines;
      }
      state.klines = await r.json();
    } catch (e) {
      console.warn('klines.json 加载失败（首次手动触发 workflow 之前会这样）', e);
      state.klines = {};
    }
    return state.klines;
  }

  async function loadSecurities() {
    if (state.securities.length) return state.securities;
    try {
      const r = await fetch('./data/securities.json', { cache: 'no-store' });
      if (!r.ok) {
        state.securities = [];
        return state.securities;
      }
      state.securities = await r.json();
    } catch (e) {
      console.warn('securities.json 加载失败', e);
      state.securities = [];
    }
    return state.securities;
  }

  // ===== Datafeed (适配 trading-chest) =====
  const datafeed = {
    // 搜索符号（trading-chest 内部使用）
    async searchSymbols(search) {
      const all = await loadSecurities();
      const k = (search || '').trim().toLowerCase();
      if (!k) return [];
      return all
        .filter(s => {
          const sym = shortSymbol(s.symbol).toLowerCase();
          return (
            sym.includes(k) ||
            (s.name_cn && s.name_cn.includes(search)) ||
            (s.name_en && s.name_en.toLowerCase().includes(k)) ||
            (s.name_hk && s.name_hk.includes(search))
          );
        })
        .slice(0, 50)
        .map(s => ({
          ticker: shortSymbol(s.symbol),
          name: s.name_cn || s.name_en || s.name_hk || shortSymbol(s.symbol),
          exchange: inferExchange(s.symbol),
          market: s.market,
          type: 'stock',
        }));
    },

    // 获取历史 K 线
    async getHistoryKLineData(symbol, period) {
      const klines = await loadKlines();
      // symbol 是 short ticker 如 AAPL，映射回 userTicker
      let entry = null;
      for (const [userTicker, data] of Object.entries(klines)) {
        if (shortSymbol(data.symbol) === symbol) {
          entry = data;
          break;
        }
      }
      if (!entry) {
        console.warn('未在 klines.json 中找到', symbol, '（如果首次运行未触发 workflow 会出现）');
        return [];
      }
      // period 映射：trading-chest 的 multiplier/timespan 格式
      let key = '1d';
      if (period.timespan === 'day')   key = '1d';
      else if (period.timespan === 'hour')  key = '1h';
      else if (period.timespan === 'minute' && period.multiplier === 15) key = '15m';
      else if (period.timespan === 'minute' && period.multiplier === 5)  key = '5m';
      const arr = (entry.candles && entry.candles[key]) || [];
      return arr.map(c => ({
        timestamp: c.timestamp * 1000,
        open: c.open,
        high: c.high,
        low: c.low,
        close: c.close,
        volume: c.volume,
      }));
    },

    async subscribe(symbol) { /* 静态数据，不需要订阅 */ },
    async unsubscribe(symbol) { /* 同上 */ },
  };

  // ===== 图表初始化 =====
  function buildSymbolInfo(userTicker, lpSymbol, name) {
    return {
      ticker: toFeederTicker(lpSymbol),
      name: name || shortSymbol(lpSymbol),
      exchange: inferExchange(lpSymbol),
      market: inferMarket(lpSymbol),
      pricePrecision: 2,
      volumePrecision: 0,
      type: 'stock',
    };
  }

  function periodToTradingChest(key) {
    if (key === '1d')  return { multiplier: 1, timespan: 'day',    text: '1D'  };
    if (key === '1h')  return { multiplier: 1, timespan: 'hour',   text: '1H'  };
    if (key === '15m') return { multiplier: 15, timespan: 'minute', text: '15M' };
    if (key === '5m')  return { multiplier: 5, timespan: 'minute', text: '5M'  };
    return { multiplier: 1, timespan: 'day', text: '1D' };
  }

  async function ensureChart() {
    if (state.chart) return state.chart;
    const { KLineChartPro } = tradingchest;
    state.chart = new KLineChartPro({
      container: '#chart-host',
      datafeed,
      symbol: { ticker: 'AAPL', name: 'AAPL', exchange: 'NASDAQ', market: 'US', pricePrecision: 2, volumePrecision: 0, type: 'stock' },
      period: { multiplier: 1, timespan: 'day', text: '1D' },
      theme: 'dark',
    });
    return state.chart;
  }

  async function switchSymbol(userTicker, lpSymbol, name) {
    state.currentUserTicker = userTicker;
    state.currentSymbol = lpSymbol;
    $('#symbol-input').value = userTicker;

    const chart = await ensureChart();
    const symbolInfo = buildSymbolInfo(userTicker, lpSymbol, name);
    chart.setSymbol(symbolInfo);
    chart.setPeriod(periodToTradingChest(state.currentPeriod));
    showStatus(`已切换到 ${userTicker}`, 'ok');
  }

  // ===== 搜索 modal =====
  function openModal() {
    $('#modal-mask').classList.add('open');
    setTimeout(() => $('#search-input').focus(), 50);
  }
  function closeModal() {
    $('#modal-mask').classList.remove('open');
  }

  async function renderSearchResults(q) {
    const all = await loadSecurities();
    const list = $('#search-results');
    if (!all.length) {
      list.innerHTML = '<div class="result-empty">夜盘清单未加载（首次部署需手动触发一次 GitHub Actions 才会生成 data/securities.json）</div>';
      return;
    }
    const k = q.trim().toLowerCase();
    if (!k) {
      list.innerHTML = '<div class="result-empty">输入 ticker 或名称关键字开始搜索</div>';
      return;
    }
    const hits = all.filter(s => {
      const sym = shortSymbol(s.symbol).toLowerCase();
      return (
        sym.includes(k) ||
        (s.name_cn && s.name_cn.includes(q)) ||
        (s.name_en && s.name_en.toLowerCase().includes(k)) ||
        (s.name_hk && s.name_hk.includes(q))
      );
    }).slice(0, 50);

    if (!hits.length) {
      list.innerHTML = '<div class="result-empty">无匹配结果。试试「手动输入」tab，可输入任意 ticker。</div>';
      return;
    }
    list.innerHTML = hits.map(s => {
      const m = s.market || 'US';
      const displayName = s.name_cn || s.name_en || s.name_hk || shortSymbol(s.symbol);
      return `
        <div class="result-item" data-sym="${s.symbol}" data-name="${displayName.replace(/"/g, '&quot;')}">
          <div class="left">
            <span class="badge ${m.toLowerCase()}">${m}</span>
            <strong>${shortSymbol(s.symbol)}</strong>
            <span>${displayName}</span>
          </div>
          <div class="right">${s.name_en || ''}</div>
        </div>
      `;
    }).join('');

    list.querySelectorAll('.result-item').forEach(el => {
      el.onclick = () => {
        const lp = el.dataset.sym;
        const nm = el.dataset.name;
        const user = shortSymbol(lp);
        // 同步添加到 klines.json 的临时视图（如果不存在）
        registerInMemory(user, lp, nm);
        switchSymbol(user, lp, nm);
        closeModal();
      };
    });
  }

  // 用户手动输入的 ticker：先入内存（不写文件），等 workflow 跑过就有正式数据
  function registerInMemory(userTicker, lpSymbol, name) {
    if (!state.klines) state.klines = {};
    if (state.klines[userTicker]) return;
    state.klines[userTicker] = {
      symbol: lpSymbol,
      name: name || userTicker,
      type: 'stock',
      candles: { '1d': [], '1h': [], '15m': [], '5m': [] },
      static_info: {},
      fetched_at: null,
      _manual: true,
    };
  }

  // ===== 事件绑定 =====
  $('#open-search').onclick = openModal;
  $('#modal-close').onclick = closeModal;
  $('#modal-mask').onclick = (e) => { if (e.target.id === 'modal-mask') closeModal(); };

  $all('.modal-tabs button').forEach(btn => {
    btn.onclick = () => {
      $all('.modal-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      $all('.tab-pane').forEach(p => p.classList.remove('active'));
      $('#tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'search') setTimeout(() => $('#search-input').focus(), 50);
      if (btn.dataset.tab === 'manual') setTimeout(() => $('#manual-input').focus(), 50);
    };
  });

  $('#search-input').oninput = (e) => renderSearchResults(e.target.value);
  $('#search-input').onkeydown = (e) => {
    if (e.key === 'Enter') {
      const first = $('#search-results .result-item');
      if (first) first.click();
    }
  };

  $('#manual-add').onclick = () => {
    const raw = $('#manual-input').value.trim().toUpperCase();
    if (!raw) { showStatus('请输入 ticker', 'err'); return; }
    // 标准化为长桥格式
    let lp = raw;
    if (!raw.includes('.')) {
      if (/^\d{6}$/.test(raw)) {
        // A 股 6 位数字 → 默认上交所
        lp = raw + '.SH';
      } else if (/^\d{5}$/.test(raw)) {
        lp = raw + '.HK';
      } else {
        lp = raw + '.US';
      }
    }
    const user = raw.replace(/\.(US|HK|CN|SH|SZ)$/, '');
    registerInMemory(user, lp, user);
    switchSymbol(user, lp, user);
    closeModal();
    showStatus(`已添加 ${user}（记得在 data/symbols.json 里登记，workflow 才会拉 K 线）`, 'ok', 4000);
  };

  $('#symbol-input').onkeydown = (e) => {
    if (e.key === 'Enter') {
      const v = e.target.value.trim();
      if (v) {
        let lp = v.toUpperCase();
        if (!lp.includes('.')) {
          if (/^\d{6}$/.test(lp)) lp += '.SH';
          else if (/^\d{5}$/.test(lp)) lp += '.HK';
          else lp += '.US';
        }
        const user = v.trim().toUpperCase();
        registerInMemory(user, lp, user);
        switchSymbol(user, lp, user);
      }
    }
  };

  // 快捷键 / 打开搜索
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      openModal();
    }
    if (e.key === 'Escape') closeModal();
  });

  // 周期切换
  $all('#periods button').forEach(btn => {
    btn.onclick = async () => {
      $all('#periods button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.currentPeriod = btn.dataset.period;
      if (state.chart) {
        state.chart.setPeriod(periodToTradingChest(state.currentPeriod));
      }
    };
  });

  // 清空画图
  $('#reset-drawing').onclick = () => {
    if (state.chart) {
      try {
        // trading-chest 暴露的方法（不同版本字段名可能不同，做最稳的尝试）
        if (typeof state.chart.removeAllOverlay === 'function') state.chart.removeAllOverlay();
        else if (typeof state.chart.createOverlay === 'function' && state.chart.getOverlay) {
          // 0.5.x 真实 API：没有 removeAllOverlay，靠 createIndicator 0 覆盖
        }
      } catch (e) { console.warn(e); }
      showStatus('画图已重置（刷新页面效果更彻底）', 'ok');
    }
  };

  // ===== 启动 =====
  (async function bootstrap() {
    await Promise.all([loadKlines(), loadSecurities()]);
    await ensureChart();

    // 默认显示 AAPL（如果 klines.json 已生成）或提示用户运行 workflow
    const klines = state.klines;
    const firstUserTicker = Object.keys(klines).find(k => !k.startsWith('_'));
    if (firstUserTicker) {
      const entry = klines[firstUserTicker];
      switchSymbol(firstUserTicker, entry.symbol, entry.name);
    } else if (state.securities.length) {
      const sample = state.securities[0];
      const user = shortSymbol(sample.symbol);
      const lp = sample.symbol;
      registerInMemory(user, lp, sample.name_cn || sample.name_en || user);
      switchSymbol(user, lp, sample.name_cn || sample.name_en || user);
      showStatus('symbols.json 为空，已加载夜盘第一只标的展示。', 'ok', 3500);
    } else {
      showStatus('data/ 目录为空，请先在 GitHub Actions 手动触发一次 workflow', 'err', 6000);
    }
  })();
  </script>
</body>
